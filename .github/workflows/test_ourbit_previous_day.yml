name: Test Ourbit Previous Daily Candle

on:
  workflow_dispatch:

jobs:

  test-previous-day:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Previous Daily Candle
        run: |
          python test_ourbit_previous_day.py
