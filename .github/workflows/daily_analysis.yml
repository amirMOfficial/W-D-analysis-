name: Bitcoin Daily Analysis

on:
  workflow_dispatch:

  schedule:
    # 00:00 UTC = 03:30 UTC+3:30
    - cron: "0 0 * * *"


permissions:
  contents: write


jobs:

  daily-analysis:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bitcoin Daily Analysis
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Save daily state
        run: |

          if git diff --quiet -- data/daily_state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily_state.json

          git commit \
            -m "Update daily BTC state"

          git push
