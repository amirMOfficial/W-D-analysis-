name: Test Fibonacci Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-fibonacci:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fibonacci Memory Test
        run: |
          python test_fibonacci_tracker.py

      - name: Show Fibonacci Database
        run: |
          cat data/fibonacci_levels.json
